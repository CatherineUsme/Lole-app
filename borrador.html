<!-- SECCIÓN HERO / PORTADA -->
<section class="relative min-h-[85vh] flex items-center bg-lole-navy overflow-hidden">

  <!-- 1. Imagen de fondo con capa oscura (Overlay) -->
  <div class="absolute inset-0 z-0">
    <!-- Imagen del centro de la ciudad -->
    <img 
      src="ruta-a-tu-imagen.jpg" 
      alt="Centro de Medellín de noche" 
      class="w-full h-full object-cover object-center"
    />
    <!-- Capa de sombra/degradado para oscurecer y mejorar legibilidad del texto -->
    <div class="absolute inset-0 bg-gradient-to-r from-lole-navy via-lole-navy/80 to-transparent"></div>
  </div>

  <!-- 2. Contenido principal (Texto y Buscador) -->
  <div class="relative z-10 max-w-7xl mx-auto px-6 py-16 w-full">
    <div class="max-w-2xl">
      
      <!-- Título Principal -->
      <h1 class="font-display text-4xl sm:text-5xl lg:text-6xl font-normal text-lole-cream leading-tight mb-6">
        Compra en el centro como si lo conocieras de toda la vida.
      </h1>

      <!-- Párrafo descriptivo -->
      <p class="text-base sm:text-lg text-lole-cream/80 font-body mb-8 leading-relaxed">
        Busca lo que necesitas y te mostramos en el mapa dónde comprarlo al mejor precio-calidad. ¿No quieres bajar? Un Personal Shopper va por ti.
      </p>

      <!-- Barra de búsqueda principal -->
      <div class="relative mb-6">
        <div class="flex items-center bg-lole-navy/60 backdrop-blur-md border border-white/20 rounded-full p-2 focus-within:border-lole-gold transition-colors">
          <!-- Icono de Lupa -->
          <svg class="w-6 h-6 text-lole-cream/60 ml-4 mr-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          
          <!-- Input para escribir -->
          <input 
            type="text" 
            placeholder="¿Qué necesitas? Ej: nevera, tenis, celular..." 
            class="w-full bg-transparent text-lole-cream placeholder-lole-cream/50 text-sm sm:text-base focus:outline-none pr-4"
          />

          <!-- Botón Buscar -->
          <button class="bg-lole-gold hover:bg-lole-gold-warm text-lole-navy font-medium px-6 py-2.5 rounded-full text-sm transition-colors shrink-0">
            Buscar
          </button>
        </div>
      </div>

      <!-- Píldoras de Categorías Rápidas -->
      <div class="flex flex-wrap gap-2.5 items-center">
        <button class="px-4 py-1.5 rounded-full border border-white/20 bg-lole-navy/40 text-xs sm:text-sm text-lole-cream hover:border-lole-gold hover:text-lole-gold transition-all">
          Electrodomésticos
        </button>
        <button class="px-4 py-1.5 rounded-full border border-white/20 bg-lole-navy/40 text-xs sm:text-sm text-lole-cream hover:border-lole-gold hover:text-lole-gold transition-all">
          Tecnología
        </button>
        <button class="px-4 py-1.5 rounded-full border border-white/20 bg-lole-navy/40 text-xs sm:text-sm text-lole-cream hover:border-lole-gold hover:text-lole-gold transition-all">
          Ropa
        </button>
        <button class="px-4 py-1.5 rounded-full border border-white/20 bg-lole-navy/40 text-xs sm:text-sm text-lole-cream hover:border-lole-gold hover:text-lole-gold transition-all">
          Calzado
        </button>
        <button class="px-4 py-1.5 rounded-full border border-white/20 bg-lole-navy/40 text-xs sm:text-sm text-lole-cream hover:border-lole-gold hover:text-lole-gold transition-all">
          Hogar
        </button>
      </div>

    </div>
  </div>

</section>
